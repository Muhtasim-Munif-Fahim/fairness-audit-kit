[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-audit-kit"
version = "0.1.0"
description = "Model fairness and bias evaluation toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Muhtasim Munif Fahim"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
